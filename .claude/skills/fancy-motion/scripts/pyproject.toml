[project]
name = "fancy-motion-tools"
version = "1.0.0"
description = "Voice, score, mix and QA tooling for the /fancy-motion skill. Author: Awaiz Ahmed."
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.4",
  "scipy>=1.14",
  "soundfile==0.14.0",
  "pyloudnorm>=0.1.1",
  "kokoro-onnx==0.6.1",
  "onnxruntime==1.31.0",
  "fonttools[woff]>=4.55",
]

[dependency-groups]
qa = ["faster-whisper>=1.1"]

[tool.uv]
package = false
